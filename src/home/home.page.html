<ion-header [translucent]="true">
    <ion-toolbar color="primary">
        <ion-title>Profile Card</ion-title>
    </ion-toolbar>
</ion-header>
<ion-content [fullscreen]="true" class="ion-padding">
    <!-- Exercise 1 and 2: my profile -->
    <ion-card color="light">
        <ion-card-header>
            <ion-card-title>{{ me().name }}</ion-card-title>
            <ion-card-subtitle>{{ me().section }}</ion-card-subtitle>
        </ion-card-header>
        <ion-card-content>
            @for (skill of me().skills; track skill) {
            <ion-chip color="primary">
                {{ skill }}
            </ion-chip>
            }@empty {
            <p>No skills added yet.</p>
            }
            <p class="count"> Skills: {{ skillCount() }} </p>
            <ion-button expand="block" color="primary" onClick={addSkill} disabled={allAdded()}>
                Add Skill
            </ion-button>
        </ion-card-content>
    </ion-card>
</ion-content>
